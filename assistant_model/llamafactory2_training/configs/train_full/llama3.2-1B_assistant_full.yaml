### model
model_name_or_path: ${ASSISTANT_MODEL_ROOT}/init/Llama-3.2-1B-Instruct-8layers/
trust_remote_code: true

### method
stage: pt
do_train: true
finetuning_type: full

### dataset
dataset: authorized_wm_corpus_llama
template: llama3
cutoff_len: 512
packing: false
max_samples: null
overwrite_cache: true
preprocessing_num_workers: 1
dataloader_num_workers: 0
val_size: 0.0
remove_unused_columns: false

### output
output_dir: ${ASSISTANT_MODEL_ROOT}/Llama-3.2-1B-Instruct-8layers
overwrite_output_dir: true
save_only_model: false
save_steps: 1000
save_total_limit: 3
ignore_data_skip: true

### train
num_train_epochs: 10
per_device_train_batch_size: 10
learning_rate: 2e-4
lr_scheduler_type: cosine
warmup_ratio: 0.01
weight_decay: 0
max_grad_norm: 1.0
optim: adamw_torch
seed: 1234
ddp_find_unused_parameters: false
use_cpu: false
fp16: true
dataloader_pin_memory: true

### logging
logging_steps: 1
report_to: none
disable_tqdm: false
plot_loss: true
predict_with_generate: false
